name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch makes an in-flight run redundant. Tags are
# excluded so a release build is never cancelled part way through.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # Cheap and platform-independent, so it runs once on Linux rather than
  # duplicated across both build runners.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      # --ignore-scripts skips the postinstall that downloads Electron. Linting,
      # formatting and tsc are all pure JavaScript and never touch the binary,
      # so this saves a ~300 MB download.
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck

  build:
    name: ${{ matrix.name }}
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      # One platform failing should not hide the other's result.
      fail-fast: false
      matrix:
        include:
          - name: macOS (arm64)
            os: macos-latest
            script: build:mac
            artifact: sales-pro-macos-arm64
            paths: |
              release/*.dmg
              release/*.zip
          - name: Windows (x64, arm64)
            os: windows-latest
            script: build:win
            artifact: sales-pro-windows
            paths: release/*.exe

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      # Electron is a ~100 MB download per platform and electron-builder
      # fetches more toolchain on top. Both honour a cache directory, so point
      # them inside the workspace where one cache entry covers both.
      - name: Cache Electron downloads
        uses: actions/cache@v6
        with:
          path: .cache
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-electron-

      # electron-builder creates its cache directory non-recursively, so the
      # parent has to exist on a cache miss. bash rather than the Windows
      # default shell, so one command covers both runners.
      - name: Prepare cache directories
        shell: bash
        run: mkdir -p .cache/electron .cache/electron-builder

      # Electron's own postinstall does the download, so the cache variable
      # belongs on this step rather than the build.
      - name: Install dependencies
        run: npm ci
        env:
          electron_config_cache: ${{ github.workspace }}/.cache/electron

      # The build scripts run typecheck first, then electron-builder.
      # --publish never is belt and braces: electron-builder.yml already sets
      # publish to null.
      - name: Build
        run: npm run ${{ matrix.script }} -- --publish never
        env:
          ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
          # Unsigned by default so branches and forks build without secrets.
          # To sign, remove this and supply certificates instead:
          #   macOS    CSC_LINK, CSC_KEY_PASSWORD, and for notarisation
          #            APPLE_API_KEY, APPLE_API_KEY_ID, APPLE_API_ISSUER
          #            plus mac.notarize in electron-builder.yml
          #   Windows  WIN_CSC_LINK, WIN_CSC_KEY_PASSWORD
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Release
    # Tags only. Pushes to main and PRs lint; a manual run builds artifacts
    # without a release.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        run: >
          gh release create "$GITHUB_REF_NAME" artifacts/*
          --repo "$GITHUB_REPOSITORY"
          --title "$GITHUB_REF_NAME"
          --generate-notes
          --verify-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
